        narrative: { type: string, maxLength: 20000 }
        complexitySize: { type: [string, "null"], enum: [XS, S, M, L, XL, XXL, null] }
        recommendation: { type: string, maxLength: 20000 }
        recommendationRationale: { type: string, maxLength: 20000 }
        prerequisites: { type: string, maxLength: 20000 }
        cautions: { type: string, maxLength: 20000 }
        alternatives: { type: string, maxLength: 20000 }
        validationQuestions: { type: string, maxLength: 20000 }
        mitigation: { type: string, maxLength: 20000 }
        mitigationValidation: { type: string, maxLength: 20000 }
