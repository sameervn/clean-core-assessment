openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /shared-assessments/notifications/preferences:
    get:
      operationId: getReviewNotificationPreferences
      responses:
        "200":
          description: Current user's opt-in setting; disabled by default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewNotificationPreference" }
    put:
      operationId: updateReviewNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewNotificationPreference" }
      responses:
        "200":
          description: Persisted account-scoped preference; only future events are eligible on opt-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewNotificationPreference" }
  /shared-assessments/notifications:
    get:
      operationId: listReviewNotifications
      parameters:
        - name: cursor
          in: query
          description: Exclusive event ID from nextCursor. Pages are newest first and always scoped to the signed-in recipient and current access. Newer arrivals appear on refresh, not in older pages.
          schema: { type: string, pattern: "^[1-9][0-9]{0,18}$", maxLength: 19 }
        - name: filter
          in: query
          description: Apply the same filter when following nextCursor.
          schema: { type: string, enum: [all, unread], default: all }
      responses:
        "200":
          description: Up to 100 notifications filtered by current membership and assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewNotificationPage" }
        "400": { description: Invalid filter or cursor (must be a positive PostgreSQL bigint event ID) }
  /shared-assessments/notifications/{notificationId}/read:
    put:
      operationId: readReviewNotification
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]*$" } }
      responses:
        "200": { description: Marked read idempotently for current recipient and membership only }
        "404": { description: Notification not available to this account }
  /shared-assessments:
    get:
      operationId: listSharedAssessments
      responses:
        "200":
          description: Only explicitly joined assessments
          content:
            application/json:
              schema:
                type: object
                required: [assessments]
                properties:
                  assessments: { type: array, items: { $ref: "#/components/schemas/SharedAssessment" } }
    post:
      operationId: publishSharedAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedPublish" }
      responses:
        "200":
          description: Idempotent owner-scoped publish; browser copy is not changed
          content:
            application/json:
              schema:
                type: object
                required: [assessment, existing]
                properties:
                  assessment: { $ref: "#/components/schemas/SharedAssessment" }
                  existing: { type: boolean }
  /shared-assessments/workspace-review:
    get:
      operationId: getWorkspaceReview
      parameters:
        - { name: importKey, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: key, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        "200":
          description: Owner-scoped shared identity and eligible independent reviewers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceReviewContext" }
    post:
      operationId: prepareWorkspaceReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceReviewInput" }
      responses:
        "200":
          description: Selected snapshot saved idempotently; explicit owner invitation grants review membership only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceReviewResult" }
        "409": { description: Compare the current shared revision; local work is unchanged }
  /shared-assessments/administration:
    get:
      operationId: sharedAssessmentAdministration
      responses:
        "200": { description: Admin-only assessment identity metadata and active account identities; not content access }
  /shared-assessments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSharedAssessment
      responses:
        "200":
          description: Membership-checked assessment, entities, members and latest 500 audit events
          content:
            application/json:
              schema:
                type: object
                required: [assessment, entities, members, events]
                properties:
                  assessment: { $ref: "#/components/schemas/SharedAssessment" }
                  entities: { type: array, items: { $ref: "#/components/schemas/SharedEntity" } }
                  members: { type: array, items: { type: object, additionalProperties: true } }
                  events: { type: array, items: { type: object, additionalProperties: true } }
  /shared-assessments/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateSharedMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedMembership" }
      responses:
        "200": { description: Admin-only membership updated; null removes access }
  /shared-assessments/entities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveSharedEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedEdit" }
      responses:
        "200":
          description: New immutable revision; developer edits require a new submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntityEnvelope" }
        "409": { description: Stale revision; retain and compare local draft }
  /shared-assessments/entities/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sharedReviewAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedAction" }
      responses:
        "200":
          description: Idempotent versioned transition; approval seals a report using the current company default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntityEnvelope" }
        "409": { description: "Stale version, invalid transition or no previewed company default" }
  /shared-assessments/entities/{id}/reviewer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: assignSharedReviewer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedAssignment" }
      responses:
        "200":
          description: Admin-assigned independent reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntityEnvelope" }
  /shared-assessments/github/status:
    get:
      operationId: sharedGithubStatus
      responses:
        "200": { description: Configuration and account connection state plus approved repository names; never credentials }
  /shared-assessments/github/connect:
    post:
      operationId: connectSharedGithub
      responses:
        "200": { description: Enable this developer's use of configured read-only service access }
    delete:
      operationId: disconnectSharedGithub
      responses:
        "200": { description: Disable future fetches for this account; retain immutable review evidence }
  /shared-assessments/github/files:
    get:
      operationId: sharedGithubFiles
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: ref, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Immutable commit and complete bounded supported-file listing; truncated trees rejected }
  /shared-assessments/entities/{id}/source:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: mapSharedGithubSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedSourceMapping" }
      responses:
        "200": { description: New draft revision with sealed source metadata and unaccepted deterministic proposal }
  /shared-assessments/entities/{id}/source/{index}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 9 } }
    get:
      operationId: readSharedSource
      responses:
        "200": { description: Membership-checked immutable source text and provenance }
  /shared-assessments/entities/{id}/evaluate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: evaluateSharedSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedVersion" }
      responses:
        "200": { description: Unaccepted deterministic proposal with file/line evidence; no execution or AI transfer }
  /shared-assessments/company-templates:
    get:
      operationId: listCompanyTemplates
      responses:
        "200": { description: Company template metadata and private-storage availability }
    post:
      operationId: uploadCompanyTemplate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CompanyTemplateUpload" }
      responses:
        "200": { description: "Validated DOCX version; Admin only, maximum 4 MB; old versions retained" }
  /shared-assessments/company-templates/{id}/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewCompanyTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedVersion" }
      responses:
        "200":
          description: Fictional populated preview; Admin only
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /shared-assessments/company-templates/{id}/default:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: selectCompanyTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedVersion" }
      responses:
        "200": { description: Previewed company default selected atomically; Admin only }
  /shared-assessments/approvals/list:
    get:
      operationId: listSharedApprovals
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: kind, in: query, schema: { type: string, enum: [all, object, interface], default: all } }
        - { name: showSuperseded, in: query, schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "200":
          description: Member-visible approvals ordered by descending approval time and ID. Cursors are bound to filters; refresh without a cursor for newest approvals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        "400": { description: Invalid filters or cursor }
  /shared-assessments/approvals/download:
    post:
      operationId: downloadSharedApprovals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovedDownload" }
      responses:
        "200":
          description: Sealed approved DOCX or complete ZIP; up to 50 files and 40 MB; membership and export permission checked
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /clean-core/knowledge/cleanup:
    get:
      operationId: getKnowledgeCleanup
      responses:
        "200":
          description: Latest automatic or manual cleanup report (administrators only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeCleanupStatus"
    post:
      operationId: runKnowledgeCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeCleanupInput"
      responses:
        "200":
          description: Bounded cleanup result (administrators only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeCleanupReport"
  /report-templates:
    get:
      operationId: listReportTemplates
      responses:
        "200":
          description: Account-owned templates and active selection
          content:
            application/json:
              schema:
                type: object
                required: [templates, activeId, configured]
                properties:
                  configured: { type: boolean }
                  activeId: { type: [string, "null"] }
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/WordTemplate" }
  /report-templates/reference:
    get:
      operationId: wordTemplateReference
      responses:
        "200":
          description: Placeholder reference and supported layout limitations
  /report-templates/sample:
    get:
      operationId: downloadWordTemplateSample
      responses:
        "200":
          description: Explicit built-in DOCX template
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /report-templates/uploads:
    post:
      operationId: startWordTemplateUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordUploadInput"
      responses:
        "200":
          description: Private direct upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadUrl]
                properties:
                  id: { type: string }
                  uploadUrl: { type: string }
  /report-templates/uploads/{id}/process:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: validateWordTemplateUpload
      responses:
        "200":
          description: Validated private template, not activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordTemplate" }
  /report-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateWordTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordUpdateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordTemplate" }
    delete:
      operationId: deleteWordTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordDeleteInput"
      responses:
        "204": { description: Template deleted }
  /report-templates/preview:
    post:
      operationId: previewWordTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordPreviewInput"
      responses:
        "200":
          description: Populated fictional example DOCX; export authorization required
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /report-templates/render:
    post:
      operationId: renderWordReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordRenderInput"
      responses:
        "200":
          description: One DOCX or complete ZIP, never partial
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /clean-core/knowledge:
    get:
      operationId: listKnowledge
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Shared authenticated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeList"
  /clean-core/knowledge/uploads:
    post:
      operationId: startKnowledgeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeUpload" }
      responses:
        "200":
          description: Private temporary write authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeUploadTicket" }
  /clean-core/knowledge/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKnowledgeDocument
      responses:
        "200":
          description: Document with plain text passages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDetail" }
    delete:
      operationId: removeKnowledgeDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeVersion" }
      responses:
        "204": { description: Removed from future retrieval }
  /clean-core/knowledge/{id}/process:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: processKnowledgeUpload
      responses:
        "200":
          description: Processed document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
  /clean-core/knowledge/{id}/file/{version}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: downloadKnowledgeFile
      responses:
        "200":
          description: Authenticated current-version download only
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /clean-core/ai/preview:
    post:
      operationId: previewAssessmentExplanation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeAiRequest" }
      responses:
        "200":
          description: Exact bounded provider payload; no external AI call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePreview" }
  /admin/audit:
    get:
      operationId: listAccountAudit
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/AccountAuditAction" } }
        - { name: from, in: query, description: Inclusive UTC date, schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive UTC date, schema: { type: string, format: date } }
      responses:
        "200":
          description: Read-only account audit, newest first, 25 entries per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountAuditPage" }
        "400": { description: Invalid filters }
        "401": { description: Sign-in required }
        "403": { description: Admin role and completed password change required }
        "503": { description: Audit storage unavailable }
  /auth/me:
    get:
      operationId: getLocalSession
      responses:
        "200":
          description: Current user or anonymous session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSession" }
  /auth/login:
    post:
      operationId: loginLocalUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated session cookie and CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSession" }
  /auth/logout:
    post:
      operationId: logoutLocalUser
      responses:
        "200": { description: Session revoked }
  /auth/password:
    post:
      operationId: changeLocalPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "200": { description: Password changed and all sessions revoked }
  /auth/authorize:
    post:
      operationId: authorizeLocalAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionCheckInput" }
      responses:
        "200": { description: Current permission granted }
        "403": { description: Permission denied }
  /admin/users:
    get:
      operationId: listLocalUsers
      responses:
        "200":
          description: Admin-only user list and available permissions
          content:
            application/json:
              schema:
                type: object
                required: [users, permissions, roles]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/LocalUser" } }
                  permissions: { type: array, items: { type: string } }
                  roles: { type: array, items: { type: string } }
    post:
      operationId: createLocalUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreationInput" }
      responses:
        "201":
          description: Created user with mandatory password change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUserEnvelope" }
  /admin/users/{id}:
    patch:
      operationId: updateLocalUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUserEnvelope" }
  /admin/users/{id}/reset-password:
    post:
      operationId: resetLocalUserPassword
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200": { description: Temporary password set and sessions revoked }
  /clean-core/review-demo:
    get:
      operationId: reviewCleanCoreDemo
      responses:
        "200":
          description: Read-only demonstration for users with view permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoResult" }
  /clean-core/ai/limiter-health:
    get:
      operationId: getAiLimiterHealth
      description: Gateway-authorized non-consuming limiter readiness and process-local metrics. Never calls the AI provider.
      responses:
        "200":
          description: Limiter probe succeeded (cached at most five seconds)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiLimiterHealth" }
        "401":
          description: Missing or invalid gateway assertion
        "503":
          description: Limiter unavailable, or AI disabled or not configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AiLimiterHealth"
                  - type: object
                    required: [message]
                    properties:
                      message: { type: string }
  /clean-core/ai/status:
    get:
      operationId: getAssessmentAiStatus
      responses:
        "200":
          description: Safe configuration status, never credentials or endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAiStatus" }
  /clean-core/ai/explain:
    post:
      operationId: explainAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeAiConsent" }
      responses:
        "200":
          description: Unaccepted AI draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentExplanation" }
        "400": { description: Invalid summary }
        "403": { description: Verified gateway identity required }
        "429": { description: Rate or concurrency limit }
        "503": { description: "Disabled, unconfigured or unavailable" }
  /clean-core/demo:
    post:
      operationId: loadCleanCoreDemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentContext"
      responses:
        "200":
          description: Original demo evidence and assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResult"
  /clean-core/assessment:
    post:
      operationId: runCleanCoreAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "200":
          description: Original Clean Core engine output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
  /clean-core/evidence:
    post:
      operationId: uploadCleanCoreEvidence
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EvidenceUpload"
      responses:
        "200":
          description: Validated normalized evidence with integrity attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRecord"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ReviewNotificationPage:
      type: object
      required: [notifications, nextCursor]
      properties:
        notifications: { type: array, items: { $ref: "#/components/schemas/ReviewNotification" } }
        nextCursor:
          type: [string, "null"]
          description: Exclusive cursor for older matching alerts, or null when no more remain. Not an unread total or a snapshot; current access and read state are checked on each request.
