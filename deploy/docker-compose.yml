services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: clean_core
      POSTGRES_USER: clean_core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clean_core -d clean_core"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: clean-core:local
    env_file: ${CC_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://clean_core:${POSTGRES_PASSWORD}@postgres:5432/clean_core
      CC_DB_ALLOW_PLAINTEXT: "true"
    command: [node, dist/migrate.mjs]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
  app:
    image: clean-core:local
    build: { context: .. }
    env_file: ${CC_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://clean_core:${POSTGRES_PASSWORD}@postgres:5432/clean_core
      CC_DB_ALLOW_PLAINTEXT: "true"
      CC_COOKIE_INSECURE: "true"
      CC_KNOWLEDGE_STORAGE: local
      PRIVATE_OBJECT_DIR: /documents/private
      CC_STORAGE_LOCAL_DIR: /data
      CC_REPLICA_COUNT: "1"
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [documents:/data]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 4
volumes:
  postgres-data:
  documents:
